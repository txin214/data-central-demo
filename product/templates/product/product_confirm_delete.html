{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body text-center">
            <h2 class="card-title text-danger">Delete Product</h2>
            <p class="card-text">Are you sure you want to delete the product "{{ object.description }}"?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger mr-2">Yes, delete</button>
                <a href="{% url 'product:product-list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
