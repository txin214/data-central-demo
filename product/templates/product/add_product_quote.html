{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Add New Product Quote</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Add Quote</button>
        <a href="{% url 'product:product_quote_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
