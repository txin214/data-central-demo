{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href=" {% static  'sitework/favicon.svg' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>

 
        <!-- CSS -->
        
        <link rel="stylesheet" href="https://bootswatch.com/5/cosmo/bootstrap.min.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

        <!-- JavaScript -->

        <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>


	<!-- JavaScript Popper -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>

	

	 <!-- Bootstrap Max CDN --> 
	  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-primary justify-content-left">
        <a class="navbar-brand main-heading text-white" href="/dashboard/">
            <img src="{% static 'crm/ologo.png' %}" width="200" alt="logo">
        </a>
        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url "crm:home" %}">Customer</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url "sitework:home" %}">Site Work</a>  
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url "product:product-list" %}">Product</a>  
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/admin/">Admin</a>      
            </li>
        </ul>
    </nav>

    {% if breadcrumbs %}
    <div class="container" style="padding-left: 0;"> 
        <div class="breadcrumb-container" style="margin-left: 0;"> <!-- Adjust breadcrumbs alignment -->
            {% include "dynamic_breadcrumbs/breadcrumbs.html" with breadcrumbs=breadcrumbs %}
        </div>
    </div>
    {% endif %} 

    <div class="container" style="padding-left: 0;"> 
        <h3 style="font-weight: bold;">{% block title %}{% endblock %}</h3>        
        {% block content %}{% endblock %}
    </div>
</body>

</html>
