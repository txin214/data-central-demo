{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Edit Finish: {{ finish.name }}</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'product:finishes' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
