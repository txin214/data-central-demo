{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div>
      <span class="fw-bold text-primary" style="font-size: 1.1rem; letter-spacing: 1px;">ALLEN KITCHEN & BATH</span>
      <h2 class="fw-bold mb-0" style="font-size: 2rem;">Add Event</h2>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h6 class="mb-0">{{ job.job_code }}</h6>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{% url 'job:job_top_entry' job.id %}">

        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <label class="form-label small">Event Type</label>
            <select name="event_type" class="form-select form-select-sm" required>
              <option value="">Select event type...</option>
              <option value="top">Top</option>
              <option value="remodel">Remodel</option>
              <option value="delivery">Delivery</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Team</label>
            <select name="team" class="form-select form-select-sm" required>
              <option value="">Select team...</option>
              {% for team in teams %}
                <option value="{{ team.id }}">{{ team.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-md-4">
            <label class="form-label small">Start Date</label>
            <input type="date" name="start_date" class="form-control form-control-sm" required>
          </div>
          <div class="col-md-4">
            <label class="form-label small">End Date</label>
            <input type="date" name="end_date" class="form-control form-control-sm">
          </div>
          <div class="col-md-4">
            <label class="form-label small">Hours (optional, for calculating end date if >8)</label>
            <input type="number" name="hours" class="form-control form-control-sm" min="0">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small">Note (shows inside [ ] in calendar)</label>
          <input type="text" name="note" class="form-control form-control-sm" placeholder="Event note...">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-sm">Create Event</button>
          <a href="{% url 'job:job_top_entry' job.id %}" class="btn btn-secondary btn-sm">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
