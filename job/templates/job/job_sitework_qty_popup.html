<form hx-post="{% url 'job:job_sitework_qty_post' job_id=data.job.id %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="quoteid" value="{{ data.qte }}">
    <input type="hidden" name="subcat" value="{{ data.subcat.id }}">
    <input type="hidden" name="cat" value="{{ data.cat.id }}">
    
    <div class="input-group">
        <input type="number" class="form-control" name="qtyInput" value="{{ data.quan }}" min="0">
        <button class="btn btn-primary" type="submit">Save</button>
        <button class="btn btn-secondary" type="button" onclick="this.closest('form').remove()">Cancel</button>
    </div>
</form>
