{% extends "base.html" %}
{% block title %}Sitework Quote{% endblock %}
{% block content %}
<!-- quote_show.html-->

    <script>
        function myFunction() {
            document.getElementById("swspinner").style.visibility = "visible";
            document.getElementById("swbutton").value = "Saving...";
        }
    </script>

   
    <form  action="" method="POST">
        {% csrf_token %}
          
        <table class="table table-hover table-sm">
            {{ form.as_table }}
        </table>
        <div>
            <input id="swbutton" class="btn btn-primary" onclick="myFunction()" type="submit" value="Save">
            <div id="swspinner" class="spinner-border text-primary" role="status" 
            style="visibility:hidden; vertical-align: middle;"></div>               
        </div>
        <div class="mt-2">
            <a href="{% url 'sitework:list_url' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>      
    
  

 
    
{% endblock %}
