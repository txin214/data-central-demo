<span >
<form hx-post="{% url 'sitework:qty_post' %}" hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>
  <div >
    <h5 class="modal-title">Edit Quantity: {{data.quan}} </h5>
  </div>
  <div>
    <div class="mb-3">
      <input type="hidden" name="quoteid" value ="{{ data.qte }}">
      <input type="hidden" name="subcat" value ="{{ data.subcat.pk }}">      
    </div>
  </div>
  <div>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
      Cancel
    </button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form></span>
{% endwith %}
